<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年度價目編輯器｜雲林金鑽烏魚子</title><style>*{box-sizing:border-box}body{background:#f7f1e7;color:#26353b;font:15px/1.7 system-ui,'Microsoft JhengHei',sans-serif;margin:0}.wrap{max-width:930px;margin:36px auto;padding:0 18px}h1{color:#103640}header,p{margin-bottom:16px}.panel{border-radius:14px;background:#fff;padding:23px;margin:16px 0;box-shadow:0 8px 25px #17424d12}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:bold;display:block}input{width:100%;padding:9px 12px;border:1px solid #ccc7b8;border-radius:6px;font:inherit}small{display:block;color:#6b7477;font-weight:normal}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px 5px;border-bottom:1px solid #e8e3d8;text-align:left}th{font-size:13px}.btn{display:inline-block;border:0;padding:10px 22px;color:white;background:#145163;border-radius:7px;cursor:pointer;font:inherit;margin:5px 6px 5px 0}.secondary{background:#b36b38}.danger{background:#935049}button:hover{filter:brightness(1.12)}.note{background:#fff6df;padding:14px;border-left:4px solid #b58b4e}a{color:#0b526a}@media(max-width:650px){.fields{grid-template-columns:1fr}td input{min-width:115px}}</style></head><body><main class="wrap"><h1>年度商品・價格編輯器</h1><p>不需要改 HTML。每年調整下面的資料，再下載新的 <code>products.js</code>，覆蓋網站資料檔即可。此工具可離線使用，資料不會上傳網路。</p><div class="note"><strong>重要：</strong>預設價格留白代表「請洽詢」，不是 0 元。此工具不會直接修改電腦上的舊檔案，下載後請自行取代。正式上線前請確認新年度售價、規格及訂購單。</div><section class="panel"><div class="fields"><label>年度標示<input id="year" value=""></label><label>狀態（例如：2027 年度最新價格）<input id="status"></label><label>價目下方說明<input id="note"></label><label>訂購單檔名（orders/ 底下）<input id="orderForm"></label></div></section><section class="panel"><h2>商品規格與金額</h2><div class="table-wrap"><table><thead><tr><th>品項</th><th>規格</th><th>售價（NT$，留空顯示請洽詢）</th><th></th></tr></thead><tbody id="entries"></tbody></table></div><button class="btn secondary" type="button" id="add">＋ 新增品項</button></section><section class="panel"><button class="btn" id="save" type="button">↓ 下載更新的 products.js</button><a href="index.html#prices">返回網站查看價格區</a><p id="message" role="status"></p></section></main><script src="products.js"></script><script>
(function(){const data=window.MULLET_CATALOG||{year:'',status:'',note:'',orderForm:'orders/2025-order-form.doc',items:[]};const $=id=>document.getElementById(id);['year','status','note','orderForm'].forEach(k=>$(k).value=data[k]||'');const entries=$('entries');function makeRow(item){const tr=document.createElement('tr');for(const [key,placeholder] of [['name','品項'],['spec','規格'],['price','未確認']]){const td=document.createElement('td');const input=document.createElement('input');input.setAttribute('aria-label',placeholder);input.dataset.key=key;input.placeholder=placeholder;input.value=item[key]===null||item[key]===undefined?'':String(item[key]);if(key==='price'){input.inputMode='numeric';input.type='number';input.min='0';input.step='1'}td.appendChild(input);tr.appendChild(td)}const td=document.createElement('td');const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent='刪除';del.addEventListener('click',()=>tr.remove());td.appendChild(del);tr.appendChild(td);entries.appendChild(tr)}(data.items||[]).forEach(makeRow);$('add').addEventListener('click',()=>makeRow({name:'',spec:'',price:null}));$('save').addEventListener('click',()=>{const items=[];for(const tr of entries.querySelectorAll('tr')){const name=tr.querySelector('[data-key=name]').value.trim(),spec=tr.querySelector('[data-key=spec]').value.trim(),v=tr.querySelector('[data-key=price]').value.trim();if(!name||!spec){$('message').textContent='每一筆商品都需要名稱與規格。';return}if(v!==''&&(!/^\d+$/.test(v)||!Number.isSafeInteger(Number(v)))){$('message').textContent='價格請輸入非負整數，或留空代表請洽詢。';return}items.push({name,spec,price:v===''?null:Number(v)})}const orderForm=$('orderForm').value.trim();if(!/^orders\/[A-Za-z0-9._-]+\.(doc|docx|pdf|xlsx?)$/i.test(orderForm)){$('message').textContent='訂購單路徑必須是 orders/檔名.doc、docx、pdf 或 xls/xlsx。';return}const result={year:$('year').value.trim(),status:$('status').value.trim(),note:$('note').value.trim(),orderForm,items};const blob=new Blob(['// 年度價目，由價格編輯器產生\nwindow.MULLET_CATALOG = '+JSON.stringify(result,null,2)+';\n'],{type:'text/javascript;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='products.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent='已產生 products.js。請將下載檔覆蓋網站根目錄同名檔案，重新開啟首頁查看。'});})();
</script></body></html>
